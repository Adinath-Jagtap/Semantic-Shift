<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Semantic-Shift</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%231a1a2e'/%3E%3Cstop offset='100%25' stop-color='%2316213e'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cpath d='M9 20 L16 8 L23 20' fill='none' stroke='%2300d2ff' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='16' cy='22' r='2' fill='%230fbcf9'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
<style>
  :root{
    --bg:#F8F9FA;
    --bg-secondary:#E9ECEF;
    --border:#DEE2E6;
    --ink:#343A40;
    --ink-soft:#6C757D;
    --white:#FFFFFF;
    --hit-bg:#f0fdf4; --hit-border:#bbf7d0; --hit-text:#15803d;
    --miss-bg:#fffbeb; --miss-border:#fde68a; --miss-text:#b45309;
    --off-bg:#fef2f2; --off-border:#fecaca; --off-text:#b91c1c;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  button, input, textarea{font-family:inherit;}
  :focus-visible{outline:2px solid var(--ink); outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important;}
  }

  /* ── Shell ───────────────────────────────────────── */
  .app-shell{display:flex; height:100vh; overflow:hidden;}

  /* ── Sidebar ─────────────────────────────────────── */
  .sidebar{
    width:264px; flex-shrink:0; background:var(--bg-secondary);
    border-right:1px solid var(--border);
    display:flex; flex-direction:column; padding:18px 14px;
  }
  .brand-pill{
    display:flex; align-items:center; gap:10px;
    background:var(--white); border:1px solid var(--border); border-radius:10px;
    padding:12px 14px; cursor:pointer; user-select:none;
    font-weight:700; font-size:.86rem; letter-spacing:-.01em;
    transition:border-color .15s ease;
  }
  .brand-pill:hover{border-color:var(--ink-soft);}
  .brand-mark{
    width:22px; height:22px; border-radius:6px; background:var(--ink); color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-size:.72rem; font-weight:800; flex-shrink:0;
  }
  .sidebar-divider{height:1px; background:var(--border); margin:14px 2px;}

  .nav-item{
    display:flex; align-items:center; gap:10px;
    padding:10px 12px; border-radius:9px; cursor:pointer;
    font-size:.85rem; font-weight:600; color:var(--ink);
    background:transparent; border:1px solid transparent;
    transition:background .15s ease, border-color .15s ease;
  }
  .nav-item svg{width:16px; height:16px; flex-shrink:0;}
  .nav-item:hover{background:var(--white); border-color:var(--border);}
  .nav-item.active{background:var(--ink); border-color:var(--ink); color:#fff;}

  .cache-summary-card{
    background:var(--white); border:1px solid var(--border); border-radius:12px;
    padding:14px 15px; margin-top:14px;
  }
  .cache-summary-eyebrow{font-size:.64rem; font-weight:700; letter-spacing:.07em; color:var(--ink-soft); text-transform:uppercase;}
  .cache-summary-status{font-size:.86rem; font-weight:800; letter-spacing:.02em; margin-top:8px;}
  .cache-summary-status.hit{color:var(--hit-text);}
  .cache-summary-status.miss{color:var(--miss-text);}
  .cache-summary-status.pending{color:var(--ink-soft);}
  .cache-summary-latency{font-size:1.5rem; font-weight:800; margin-top:2px; line-height:1.3;}
  .cache-summary-label{font-size:.66rem; color:var(--ink-soft); margin-top:1px;}

  .sidebar-spacer{flex:1;}

  .repo-link{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    background:var(--white); border:1px solid var(--border); border-radius:9px;
    padding:10px 12px; text-decoration:none; color:var(--ink);
    font-size:.82rem; font-weight:600; transition:border-color .15s ease, color .15s ease;
  }
  .repo-link:hover{border-color:var(--ink-soft);}
  .repo-link svg{width:15px; height:15px; color:var(--ink-soft); flex-shrink:0;}

  /* ── Main / topbar ───────────────────────────────── */
  .main{flex:1; min-width:0; display:flex; flex-direction:column;}
  .topbar{
    height:60px; flex-shrink:0; display:flex; align-items:center; justify-content:flex-end;
    gap:10px; padding:0 28px; border-bottom:1px solid var(--border);
  }
  .mobile-menu-btn{
    display:none; align-items:center; justify-content:center;
    width:34px; height:34px; border-radius:9px; border:1px solid var(--border);
    background:var(--white); color:var(--ink); cursor:pointer; margin-right:auto;
  }
  .mobile-menu-btn svg{width:17px; height:17px;}

  .status-box{
    width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center;
    border:1px solid var(--border); position:relative;
    transition:background-color .25s ease, border-color .25s ease, box-shadow .25s ease;
  }
  .status-box .dot{width:9px; height:9px; border-radius:50%; background:currentColor;}
  .status-box.online{color:var(--hit-text); background:var(--hit-bg); border-color:var(--hit-border); box-shadow:0 0 0 4px rgba(21,128,61,.08);}
  .status-box.offline{color:var(--off-text); background:var(--off-bg); border-color:var(--off-border); box-shadow:0 0 0 4px rgba(185,28,28,.08);}
  .status-box.online .dot{animation:pulse 2.2s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
  .status-box::after{
    content:attr(data-tooltip);
    position:absolute; top:calc(100% + 9px); right:0;
    background:var(--ink); color:#fff; font-size:.7rem; font-weight:600;
    padding:6px 10px; border-radius:7px; white-space:nowrap;
    opacity:0; visibility:hidden; transform:translateY(-4px);
    transition:opacity .15s ease, transform .15s ease, visibility .15s;
    box-shadow:0 8px 20px rgba(0,0,0,.15); z-index:40; pointer-events:none;
  }
  .status-box:hover::after{opacity:1; visibility:visible; transform:translateY(0);}

  .settings-wrap{position:relative;}
  .settings-btn{
    width:34px; height:34px; border-radius:10px; border:1px solid var(--border);
    background:var(--white); display:flex; align-items:center; justify-content:center;
    cursor:pointer; color:var(--ink-soft); transition:all .15s ease;
  }
  .settings-btn svg{width:17px; height:17px;}
  .settings-btn:hover, .settings-wrap.open .settings-btn{color:var(--ink); border-color:var(--ink-soft); background:var(--bg-secondary);}
  .settings-panel{
    position:absolute; top:calc(100% + 10px); right:0; width:300px;
    background:var(--white); border:1px solid var(--border); border-radius:14px;
    box-shadow:0 16px 36px rgba(52,58,64,.16); padding:18px;
    opacity:0; visibility:hidden; transform:translateY(-6px);
    transition:opacity .18s ease, transform .18s ease, visibility .18s; z-index:35;
  }
  .settings-wrap.open .settings-panel{opacity:1; visibility:visible; transform:translateY(0);}
  .settings-title{font-size:.82rem; font-weight:700; margin-bottom:2px;}
  .settings-subtitle{font-size:.72rem; color:var(--ink-soft); margin-bottom:14px;}
  .setting-row{margin-bottom:15px;}
  .setting-row label{display:flex; justify-content:space-between; font-size:.78rem; font-weight:600; margin-bottom:7px;}
  .setting-row .val{color:var(--ink-soft); font-weight:600; font-variant-numeric:tabular-nums;}
  .setting-row input[type=range]{width:100%; accent-color:var(--ink); cursor:pointer;}
  .save-btn{
    width:100%; padding:10px; border-radius:9px; border:none; background:var(--ink); color:#fff;
    font-weight:700; font-size:.84rem; cursor:pointer; margin-top:2px; transition:background .15s ease;
  }
  .save-btn:hover{background:#1f2327;}
  .save-btn:disabled{opacity:.6; cursor:not-allowed;}
  .settings-msg{font-size:.72rem; margin-top:9px; text-align:center; min-height:14px; font-weight:600;}
  .settings-msg.success{color:var(--hit-text);}
  .settings-msg.error{color:var(--off-text);}

  /* ── Views ───────────────────────────────────────── */
  .view{flex:1; min-height:0; display:flex; flex-direction:column;}
  .hidden{display:none !important;}

  /* Chat */
  #chat-panel{flex:1; min-height:0; display:flex; flex-direction:column;}
  .chat-scroll{flex:1; overflow-y:auto; padding:26px 40px; display:flex; flex-direction:column; gap:16px;}
  .empty-state{margin:auto; text-align:center; padding:44px 26px; border:1.5px dashed var(--border); border-radius:14px; color:var(--ink-soft); max-width:360px;}
  .empty-state .title{font-weight:700; color:var(--ink); font-size:.95rem; margin-bottom:4px;}
  .empty-state .sub{font-size:.82rem;}

  .msg{display:flex;}
  .msg-user{justify-content:flex-end;}
  .msg-assistant{justify-content:flex-start;}
  .msg-user .bubble{
    background:var(--ink); color:#fff; border-radius:16px 16px 4px 16px;
    padding:11px 16px; max-width:66%; font-size:.92rem; line-height:1.55;
  }
  .msg-assistant .bubble{
    background:var(--white); border:1px solid var(--border); border-radius:16px 16px 16px 4px;
    padding:14px 18px; max-width:76%; font-size:.92rem; line-height:1.65;
  }
  .msg-meta{display:flex; align-items:center; gap:9px; margin-bottom:9px;}
  .chip{font-size:.64rem; font-weight:800; letter-spacing:.04em; padding:3px 8px; border-radius:6px;}
  .chip-hit{background:var(--hit-bg); color:var(--hit-text); border:1px solid var(--hit-border);}
  .chip-miss{background:var(--miss-bg); color:var(--miss-text); border:1px solid var(--miss-border);}
  .meta-latency{font-size:.72rem; color:var(--ink-soft); font-weight:600;}
  .msg-content p{margin:0 0 10px;}
  .msg-content p:last-child{margin-bottom:0;}
  .msg-content ul, .msg-content ol{margin:0 0 10px; padding-left:20px;}
  .msg-content code{background:var(--bg-secondary); padding:2px 6px; border-radius:4px; font-size:.85em;}
  .msg-content pre{background:#1f2327; color:#f1f3f5; padding:12px 14px; border-radius:9px; overflow-x:auto; font-size:.82rem;}
  .msg-content pre code{background:none; color:inherit; padding:0;}
  .msg-content a{color:inherit; text-decoration:underline;}
  .details-toggle{
    margin-top:11px; font-size:.72rem; font-weight:700; color:var(--ink-soft);
    background:none; border:none; cursor:pointer; padding:0; text-decoration:underline; text-underline-offset:2px;
  }
  .details-toggle:hover{color:var(--ink);}
  .details-panel{margin-top:9px; background:var(--bg-secondary); border-radius:9px; padding:10px 12px;}
  .debug-row{display:flex; justify-content:space-between; gap:12px; font-size:.74rem; padding:4px 0; border-bottom:1px dashed var(--border);}
  .debug-row:last-child{border-bottom:none;}
  .debug-row span:first-child{color:var(--ink-soft); font-weight:600;}
  .bubble-error{background:var(--off-bg); border:1px solid var(--off-border); color:var(--off-text);}

  .bubble.typing{display:flex; gap:4px; align-items:center; padding:16px 18px;}
  .bubble.typing span{width:6px; height:6px; background:var(--ink-soft); border-radius:50%; animation:bounce 1.2s infinite ease-in-out;}
  .bubble.typing span:nth-child(2){animation-delay:.15s;}
  .bubble.typing span:nth-child(3){animation-delay:.3s;}
  @keyframes bounce{0%,80%,100%{transform:translateY(0); opacity:.4;} 40%{transform:translateY(-4px); opacity:1;}}

  .composer{padding:14px 40px 22px; border-top:1px solid var(--border);}
  .composer-card{background:var(--white); border:1px solid var(--border); border-radius:16px; padding:14px 16px 10px; box-shadow:0 2px 10px rgba(52,58,64,.05); transition:border-color .15s ease;}
  .composer-card:focus-within{border-color:var(--ink-soft);}
  .composer-card textarea{
    width:100%; border:none; outline:none; resize:none; background:transparent;
    font-family:inherit; font-size:.92rem; line-height:1.5; color:var(--ink);
    max-height:160px; min-height:24px;
  }
  .composer-card textarea::placeholder{color:#9aa0a6;}
  .composer-footer{display:flex; align-items:center; justify-content:space-between; margin-top:8px;}
  .tag-pill{font-size:.66rem; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-soft); background:var(--bg-secondary); padding:5px 10px; border-radius:20px;}
  .send-btn{
    display:flex; align-items:center; gap:6px; background:var(--ink); color:#fff; border:none;
    padding:9px 18px; border-radius:20px; font-weight:700; font-size:.84rem; cursor:pointer; transition:background .15s ease;
  }
  .send-btn svg{width:14px; height:14px;}
  .send-btn:hover{background:#1f2327;}
  .send-btn:disabled{opacity:.55; cursor:not-allowed;}

  /* Dashboard */
  #dashboard-panel{flex:1; overflow-y:auto; padding:30px 40px 48px;}
  .dash-header{margin-bottom:20px;}
  .dash-title{font-size:1.35rem; font-weight:800; letter-spacing:-.01em;}
  .dash-sub{color:var(--ink-soft); font-size:.86rem; margin-top:3px;}
  .kpi-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:14px; margin-bottom:30px;}
  .kpi-card{background:var(--white); border:1px solid var(--border); border-radius:12px; padding:16px 18px;}
  .kpi-label{font-size:.66rem; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.06em;}
  .kpi-value{font-size:1.55rem; font-weight:800; margin-top:7px; letter-spacing:-.01em;}
  .section-title-row{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
  .section-title{font-size:1rem; font-weight:800;}
  .refresh-btn{
    display:flex; align-items:center; gap:6px; font-size:.78rem; font-weight:700; color:var(--ink-soft);
    background:var(--white); border:1px solid var(--border); padding:7px 13px; border-radius:8px; cursor:pointer; transition:all .15s ease;
  }
  .refresh-btn svg{width:13px; height:13px;}
  .refresh-btn:hover{color:var(--ink); border-color:var(--ink-soft);}
  .table-scroll{overflow:auto; border:1px solid var(--border); border-radius:12px; background:var(--white); max-height:480px;}
  .query-table{width:100%; border-collapse:collapse; font-size:.82rem;}
  .query-table th{
    text-align:left; background:var(--bg-secondary); color:var(--ink-soft); font-size:.66rem;
    text-transform:uppercase; letter-spacing:.05em; font-weight:800; padding:10px 14px;
    position:sticky; top:0; white-space:nowrap;
  }
  .query-table td{padding:10px 14px; border-top:1px solid var(--border); max-width:280px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .query-table tbody tr:hover{background:var(--bg);}

  /* Scrollbars */
  .chat-scroll::-webkit-scrollbar, #dashboard-panel::-webkit-scrollbar, .table-scroll::-webkit-scrollbar{width:8px; height:8px;}
  .chat-scroll::-webkit-scrollbar-thumb, #dashboard-panel::-webkit-scrollbar-thumb, .table-scroll::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px;}

  /* ── Mobile ──────────────────────────────────────── */
  .backdrop{display:none; position:fixed; inset:0; background:rgba(52,58,64,.4); z-index:45;}
  .backdrop.show{display:block;}
  @media (max-width:820px){
    .sidebar{position:fixed; top:0; bottom:0; left:-280px; z-index:50; width:264px; transition:left .22s ease; box-shadow:0 0 0 rgba(0,0,0,0);}
    .sidebar.open{left:0; box-shadow:16px 0 32px rgba(0,0,0,.14);}
    .mobile-menu-btn{display:flex;}
    .chat-scroll, .composer, #dashboard-panel{padding-left:20px; padding-right:20px;}
    .topbar{padding:0 16px;}
    .msg-user .bubble, .msg-assistant .bubble{max-width:88%;}
  }
</style>
</head>
<body>

<div class="app-shell">

  <div class="backdrop" id="backdrop"></div>

  <!-- ── Sidebar ── -->
  <aside class="sidebar" id="sidebar">
    <div class="brand-pill" id="brand-pill" title="Go to query tester">
      <span id="app-name-label">Semantic-Shift</span>
    </div>

    <div class="sidebar-divider"></div>
    <div class="nav-item active" id="nav-chat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      Query Tester
    </div>
    <div class="nav-item" id="nav-dashboard" style="margin-top:6px;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      Dashboard
    </div>

    <div class="cache-summary-card">
      <div class="cache-summary-eyebrow">Last Result</div>
      <div class="cache-summary-status pending" id="cache-summary-status">—</div>
      <div class="cache-summary-latency" id="cache-summary-latency">–</div>
      <div class="cache-summary-label">Latency</div>
    </div>

    <div class="sidebar-spacer"></div>

    <a class="repo-link" id="repo-link" href="" target="_blank" rel="noopener noreferrer">
      Repo Link
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
    </a>
  </aside>

  <!-- ── Main ── -->
  <div class="main">
    <div class="topbar">
      <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Open menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>

      <div class="status-box offline" id="status-box" data-tooltip="Checking backend…">
        <div class="dot"></div>
      </div>

      <div class="settings-wrap" id="settings-wrap">
        <button class="settings-btn" id="settings-btn" aria-label="Pipeline settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>

        <div class="settings-panel" id="settings-panel">
          <div class="settings-title">Pipeline Thresholds</div>
          <div class="settings-subtitle">Changes apply on save only</div>

          <div class="setting-row">
            <label>Cosine Similarity <span class="val" id="sim-val">0.85</span></label>
            <input type="range" id="sim-slider" min="0" max="1" step="0.01" value="0.85" />
          </div>
          <div class="setting-row">
            <label>BM25 Overlap <span class="val" id="bm25-val">0.30</span></label>
            <input type="range" id="bm25-slider" min="0" max="1" step="0.01" value="0.3" />
          </div>
          <div class="setting-row">
            <label>Cross-Encoder Score <span class="val" id="ce-val">0.50</span></label>
            <input type="range" id="ce-slider" min="-5" max="10" step="0.1" value="0.5" />
          </div>

          <button class="save-btn" id="save-settings-btn">Save</button>
          <div class="settings-msg" id="settings-msg"></div>
        </div>
      </div>
    </div>

    <!-- Chat view -->
    <div class="view" id="chat-panel">
      <div class="chat-scroll" id="chat-scroll">
        <div class="empty-state" id="chat-empty-state">
          <div class="title">No query submitted</div>
          <div class="sub">Type a question below to test the cache pipeline.</div>
        </div>
      </div>

      <div class="composer">
        <form class="composer-card" id="chat-form">
          <textarea id="chat-input" rows="1" placeholder="Type something and get answer…"></textarea>
          <div class="composer-footer">
            <span class="tag-pill">Query tester</span>
            <button type="submit" class="send-btn" id="send-btn">
              Send
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Dashboard view -->
    <div class="view hidden" id="dashboard-panel">
      <div class="dash-header">
        <div class="dash-title">Dashboard</div>
        <div class="dash-sub">Query performance and cache insights</div>
      </div>

      <div class="kpi-grid" id="kpi-grid"></div>

      <div class="section-title-row">
        <div class="section-title">Query Log</div>
        <button class="refresh-btn" id="refresh-dashboard-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
          Refresh
        </button>
      </div>
      <div id="query-table-wrap"></div>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  // ── Config ────────────────────────────────────────
  const BACKEND_URL = window.location.origin; 
  const REPO_URL = "https://github.com/Adinath-Jagtap/Semantic-Shift";
  const APP_NAME = "Semantic-Shift";

  document.title = APP_NAME;
  document.getElementById("app-name-label").textContent = APP_NAME;
  document.getElementById("repo-link").href = REPO_URL;

  let currentConfig = { similarity_threshold: 0.85, bm25_min_overlap: 0.3, crossencoder_min_score: 0.5 };
  let backendOnline = false;

  // ── DOM refs ──────────────────────────────────────
  const sidebar = document.getElementById("sidebar");
  const backdrop = document.getElementById("backdrop");
  const mobileMenuBtn = document.getElementById("mobile-menu-btn");
  const brandPill = document.getElementById("brand-pill");

  const navChat = document.getElementById("nav-chat");
  const navDashboard = document.getElementById("nav-dashboard");
  const chatPanel = document.getElementById("chat-panel");
  const dashboardPanel = document.getElementById("dashboard-panel");

  const statusBox = document.getElementById("status-box");
  const settingsWrap = document.getElementById("settings-wrap");
  const settingsBtn = document.getElementById("settings-btn");
  const simSlider = document.getElementById("sim-slider");
  const bm25Slider = document.getElementById("bm25-slider");
  const ceSlider = document.getElementById("ce-slider");
  const simVal = document.getElementById("sim-val");
  const bm25Val = document.getElementById("bm25-val");
  const ceVal = document.getElementById("ce-val");
  const saveSettingsBtn = document.getElementById("save-settings-btn");
  const settingsMsg = document.getElementById("settings-msg");

  const chatScroll = document.getElementById("chat-scroll");
  const chatEmptyState = document.getElementById("chat-empty-state");
  const chatForm = document.getElementById("chat-form");
  const chatInput = document.getElementById("chat-input");
  const sendBtn = document.getElementById("send-btn");

  const cacheSummaryStatus = document.getElementById("cache-summary-status");
  const cacheSummaryLatency = document.getElementById("cache-summary-latency");

  const kpiGrid = document.getElementById("kpi-grid");
  const queryTableWrap = document.getElementById("query-table-wrap");
  const refreshDashboardBtn = document.getElementById("refresh-dashboard-btn");

  // ── Helpers ───────────────────────────────────────
  function escapeHtml(str){
    return String(str ?? "").replace(/[&<>"']/g, ch => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[ch]));
  }

  function prettifyKey(k){
    return String(k).replace(/_/g," ").replace(/\b\w/g, c => c.toUpperCase());
  }

  function renderMarkdown(text){
    try{
      const raw = marked.parse(String(text ?? ""));
      return DOMPurify.sanitize(raw);
    }catch(e){
      return escapeHtml(text);
    }
  }

  function emptyStateHtml(title, sub){
    return `<div class="empty-state" style="margin:20px auto;">
      <div class="title">${escapeHtml(title)}</div>
      <div class="sub">${escapeHtml(sub)}</div>
    </div>`;
  }

  function scrollToBottom(){
    chatScroll.scrollTop = chatScroll.scrollHeight;
  }

  function autoResizeInput(){
    chatInput.style.height = "auto";
    chatInput.style.height = Math.min(chatInput.scrollHeight, 160) + "px";
  }

  // ── Mobile drawer ─────────────────────────────────
  function closeDrawer(){ sidebar.classList.remove("open"); backdrop.classList.remove("show"); }
  mobileMenuBtn.addEventListener("click", () => { sidebar.classList.add("open"); backdrop.classList.add("show"); });
  backdrop.addEventListener("click", closeDrawer);

  // ── View switching ────────────────────────────────
  function switchView(view){
    const isChat = view === "chat";
    chatPanel.classList.toggle("hidden", !isChat);
    dashboardPanel.classList.toggle("hidden", isChat);
    navChat.classList.toggle("active", isChat);
    navDashboard.classList.toggle("active", !isChat);
    closeDrawer();
    if(!isChat) loadDashboard();
  }
  brandPill.addEventListener("click", () => switchView("chat"));
  navChat.addEventListener("click", () => switchView("chat"));
  navDashboard.addEventListener("click", () => switchView("dashboard"));

  // ── Backend status + config ───────────────────────
  async function fetchConfig(body){
    const res = await fetch(`${BACKEND_URL}/config`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body || {})
    });
    if(!res.ok) throw new Error(`Config request failed (HTTP ${res.status})`);
    return res.json();
  }

  function updateStatusUI(){
    statusBox.classList.toggle("online", backendOnline);
    statusBox.classList.toggle("offline", !backendOnline);
    statusBox.setAttribute("data-tooltip", backendOnline ? "Backend is connected" : "Backend is not connected");
  }

  function populateSettingsInputs(cfg){
    simSlider.value = cfg.similarity_threshold;
    bm25Slider.value = cfg.bm25_min_overlap;
    ceSlider.value = cfg.crossencoder_min_score;
    simVal.textContent = Number(cfg.similarity_threshold).toFixed(2);
    bm25Val.textContent = Number(cfg.bm25_min_overlap).toFixed(2);
    ceVal.textContent = Number(cfg.crossencoder_min_score).toFixed(1);
  }

  async function refreshHealth(){
    // Use the lightweight /health endpoint — not /config — to avoid log spam.
    try{
      const res = await fetch(`${BACKEND_URL}/health`);
      backendOnline = res.ok;
    }catch(e){
      backendOnline = false;
    }
    updateStatusUI();
  }

  // ── Settings dropdown ─────────────────────────────
  let closeTimer = null;
  function openSettings(){
    clearTimeout(closeTimer);
    const alreadyOpen = settingsWrap.classList.contains("open");
    settingsWrap.classList.add("open");
    settingsMsg.textContent = "";
    settingsMsg.className = "settings-msg";
    // Only fetch config when first opening — not on every mouseenter.
    if(!alreadyOpen){
      fetchConfig({}).then(cfg => {
        backendOnline = true; updateStatusUI();
        currentConfig = cfg;
        populateSettingsInputs(currentConfig);
      }).catch(() => { backendOnline = false; updateStatusUI(); });
    }
  }
  function scheduleClose(){ closeTimer = setTimeout(() => settingsWrap.classList.remove("open"), 260); }

  settingsWrap.addEventListener("mouseenter", openSettings);
  settingsWrap.addEventListener("mouseleave", scheduleClose);
  settingsBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    settingsWrap.classList.contains("open") ? settingsWrap.classList.remove("open") : openSettings();
  });
  document.addEventListener("click", (e) => {
    if(!settingsWrap.contains(e.target)) settingsWrap.classList.remove("open");
  });

  simSlider.addEventListener("input", () => simVal.textContent = Number(simSlider.value).toFixed(2));
  bm25Slider.addEventListener("input", () => bm25Val.textContent = Number(bm25Slider.value).toFixed(2));
  ceSlider.addEventListener("input", () => ceVal.textContent = Number(ceSlider.value).toFixed(1));

  saveSettingsBtn.addEventListener("click", async () => {
    saveSettingsBtn.disabled = true;
    settingsMsg.textContent = "Saving…";
    settingsMsg.className = "settings-msg";
    const payload = {
      similarity_threshold: parseFloat(simSlider.value),
      bm25_min_overlap: parseFloat(bm25Slider.value),
      crossencoder_min_score: parseFloat(ceSlider.value)
    };
    try{
      const res = await fetch(`${BACKEND_URL}/config`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      if(!res.ok) throw new Error();
      currentConfig = payload;
      backendOnline = true; updateStatusUI();
      settingsMsg.textContent = "Saved";
      settingsMsg.className = "settings-msg success";
    }catch(e){
      settingsMsg.textContent = "Could not save — check backend";
      settingsMsg.className = "settings-msg error";
    }finally{
      saveSettingsBtn.disabled = false;
    }
  });

  // ── Chat ──────────────────────────────────────────
  function addUserMessage(text){
    const el = document.createElement("div");
    el.className = "msg msg-user";
    el.innerHTML = `<div class="bubble">${escapeHtml(text).replace(/\n/g,"<br>")}</div>`;
    chatScroll.appendChild(el);
    scrollToBottom();
  }

  function addTypingIndicator(){
    const el = document.createElement("div");
    el.className = "msg msg-assistant";
    el.id = "typing-indicator";
    el.innerHTML = `<div class="bubble typing"><span></span><span></span><span></span></div>`;
    chatScroll.appendChild(el);
    scrollToBottom();
  }
  function removeTypingIndicator(){
    const el = document.getElementById("typing-indicator");
    if(el) el.remove();
  }

  function renderDebug(debug){
    return Object.entries(debug).map(([k,v]) => {
      const display = (v !== null && typeof v === "object") ? JSON.stringify(v, null, 2) : String(v);
      return `<div class="debug-row"><span>${escapeHtml(prettifyKey(k))}</span><span>${escapeHtml(display)}</span></div>`;
    }).join("");
  }

  function addAssistantMessage(data){
    removeTypingIndicator();
    const el = document.createElement("div");
    el.className = "msg msg-assistant";
    const cached = !!data.cached;
    const latency = Number(data.latency_ms ?? 0).toFixed(1);
    let detailsHtml = "";
    if(data.debug && Object.keys(data.debug).length){
      const id = "debug-" + Math.random().toString(36).slice(2,9);
      detailsHtml = `<button class="details-toggle" type="button" data-target="${id}">Details</button>
        <div class="details-panel" id="${id}" hidden>${renderDebug(data.debug)}</div>`;
    }
    el.innerHTML = `
      <div class="bubble">
        <div class="msg-meta">
          <span class="chip ${cached ? "chip-hit" : "chip-miss"}">${cached ? "CACHE HIT" : "CACHE MISS"}</span>
          <span class="meta-latency">${latency}ms</span>
        </div>
        <div class="msg-content">${renderMarkdown(data.answer)}</div>
        ${detailsHtml}
      </div>`;
    chatScroll.appendChild(el);
    scrollToBottom();
    updateCacheSummary(cached, latency);

    const toggle = el.querySelector(".details-toggle");
    if(toggle){
      toggle.addEventListener("click", () => {
        const panel = document.getElementById(toggle.dataset.target);
        panel.hidden = !panel.hidden;
        toggle.textContent = panel.hidden ? "Details" : "Hide details";
      });
    }
  }

  function addErrorMessage(text){
    removeTypingIndicator();
    const el = document.createElement("div");
    el.className = "msg msg-assistant";
    el.innerHTML = `<div class="bubble bubble-error">${escapeHtml(text)}</div>`;
    chatScroll.appendChild(el);
    scrollToBottom();
  }

  function updateCacheSummary(cached, latencyStr){
    cacheSummaryStatus.textContent = cached ? "CACHE HIT" : "CACHE MISS";
    cacheSummaryStatus.className = "cache-summary-status " + (cached ? "hit" : "miss");
    cacheSummaryLatency.textContent = latencyStr + "ms";
  }

  async function sendQuery(text){
    const res = await fetch(`${BACKEND_URL}/v1/chat/completions`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: [{ role: "user", content: text }] })
    });
    const data = await res.json().catch(() => null);
    if(!res.ok){
      throw new Error((data && (data.detail || data.error)) || `Backend error (HTTP ${res.status})`);
    }
    return data;
  }

  function setSending(isSending){
    sendBtn.disabled = isSending;
    chatInput.disabled = isSending;
  }

  chatInput.addEventListener("input", autoResizeInput);
  chatInput.addEventListener("keydown", (e) => {
    if(e.key === "Enter" && !e.shiftKey){
      e.preventDefault();
      chatForm.requestSubmit();
    }
  });

  chatForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = chatInput.value.trim();
    if(!text || sendBtn.disabled) return;

    if(chatEmptyState.parentNode) chatEmptyState.remove();
    addUserMessage(text);
    chatInput.value = "";
    autoResizeInput();
    setSending(true);
    addTypingIndicator();

    try{
      const data = await sendQuery(text);
      addAssistantMessage(data);
      backendOnline = true; updateStatusUI();
      fetchStats().then(renderDashboardData).catch(() => {});
    }catch(err){
      addErrorMessage(err.message || "Connection failed. Check that the backend is running.");
      backendOnline = false; updateStatusUI();
    }finally{
      setSending(false);
      chatInput.focus();
    }
  });

  // ── Dashboard ─────────────────────────────────────
  async function fetchStats(){
    const res = await fetch(`${BACKEND_URL}/stats`);
    if(!res.ok) throw new Error(`Stats request failed (HTTP ${res.status})`);
    return res.json();
  }

  function kpiCard(label, value){
    return `<div class="kpi-card"><div class="kpi-label">${escapeHtml(label)}</div><div class="kpi-value">${escapeHtml(String(value))}</div></div>`;
  }

  function renderKpis(s){
    kpiGrid.innerHTML = [
      kpiCard("Requests", s.total_requests ?? 0),
      kpiCard("Hits", s.cache_hits ?? 0),
      kpiCard("Misses", s.cache_misses ?? 0),
      kpiCard("Hit Rate", `${((s.hit_rate ?? 0) * 100).toFixed(1)}%`),
      kpiCard("$ Saved", `$${Number(s.estimated_dollars_saved ?? 0).toFixed(2)}`),
      kpiCard("Time Saved", `${Number(s.estimated_time_saved_ms ?? 0).toFixed(0)}ms`)
    ].join("");
  }

  function formatCell(key, val){
    if(typeof val === "boolean"){
      if(/cache|hit|cached/i.test(key)) return val
        ? '<span class="chip chip-hit">HIT</span>'
        : '<span class="chip chip-miss">MISS</span>';
      return val ? "Yes" : "No";
    }
    if(typeof val === "number"){
      if(/latency|ms|time/i.test(key)) return `${Number(val).toFixed(1)}ms`;
      return Number.isInteger(val) ? String(val) : Number(val).toFixed(3);
    }
    if(val === null || val === undefined) return "—";
    const str = String(val);
    const short = str.length > 60 ? str.slice(0,57) + "…" : str;
    return `<span title="${escapeHtml(str)}">${escapeHtml(short)}</span>`;
  }

  function renderQueryTable(rows){
    if(!rows || rows.length === 0){
      queryTableWrap.innerHTML = emptyStateHtml("Log is empty", "Send a query to start building history.");
      return;
    }
    const reversed = [...rows].reverse();
    const keys = Object.keys(reversed[0]);
    const head = keys.map(k => `<th>${escapeHtml(prettifyKey(k))}</th>`).join("");
    const body = reversed.map(row =>
      `<tr>${keys.map(k => `<td>${formatCell(k, row[k])}</td>`).join("")}</tr>`
    ).join("");
    queryTableWrap.innerHTML = `<div class="table-scroll"><table class="query-table"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
  }

  function renderDashboardData(s){
    renderKpis(s);
    renderQueryTable(s.recent_queries || []);
  }

  async function loadDashboard(){
    try{
      const s = await fetchStats();
      backendOnline = true; updateStatusUI();
      renderDashboardData(s);
    }catch(e){
      backendOnline = false; updateStatusUI();
      kpiGrid.innerHTML = "";
      queryTableWrap.innerHTML = emptyStateHtml("Backend not reachable", "Could not fetch dashboard data.");
    }
  }
  refreshDashboardBtn.addEventListener("click", loadDashboard);

  // ── Init ──────────────────────────────────────────
  (async function init(){
    autoResizeInput();
    try{
      const cfg = await fetchConfig({});
      currentConfig = cfg;
      backendOnline = true;
    }catch(e){
      backendOnline = false;
    }
    updateStatusUI();
    populateSettingsInputs(currentConfig);
    setInterval(refreshHealth, 900000);
  })();
})();
</script>
</body>
</html>
